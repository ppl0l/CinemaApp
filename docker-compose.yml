version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: cinetrack_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: cinetrack_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/cinetrack
    depends_on:
      - mongo

volumes:
  mongo_data:
  